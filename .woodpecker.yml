clone:
  git:
    image: bash
    settings:
      lfs: false

labels:
  backend: local

steps:
  - name: build-frontend
    image: bash
    commands:
      - export PATH="/home/diama/.nvm/versions/node/v24.16.0/bin:$PATH"
      - cd applications/frontend
      - npm install
      - npm run build

  - name: build-backend
    image: bash
    commands:
      - export PATH="/usr/local/go/bin:$PATH"
      - cd applications/backend
      - rm -rf cmd/server/dist
      - cp -r ../frontend/dist cmd/server/dist
      - go mod tidy
      - go build -o aeris-server ./cmd/server

  - name: deploy-landing
    image: bash
    commands:
      - export PATH="/home/diama/.nvm/versions/node/v24.16.0/bin:$PATH"
      - if [ -f /home/diama/.woodpecker-secrets/aeris-cf.env ]; then source /home/diama/.woodpecker-secrets/aeris-cf.env; fi
      - cd landing-page
      - npm install
      - npm run build
      - npx wrangler pages deploy dist --project-name=aeris-landing --branch=main --commit-dirty=true

when:
  event: push
  branch: main
