clone:
  git:
    image: bash
    settings:
      lfs: false

labels:
  backend: local

steps:
  - name: build-landing
    image: bash
    commands:
      - export PATH="/home/diama/.nvm/versions/node/v24.16.0/bin:$PATH"
      - cd landing-page
      - npm install
      - npm run build

  - name: deploy-landing
    image: bash
    commands:
      - export PATH="/home/diama/.nvm/versions/node/v24.16.0/bin:$PATH"
      - mkdir -p /tmp/aeris-landing-dist
      - rm -rf /tmp/aeris-landing-dist/*
      - cp -r landing-page/dist/* /tmp/aeris-landing-dist/
      - echo "Production static assets deployed to /tmp/aeris-landing-dist successfully!"

when:
  event: push
  branch: main