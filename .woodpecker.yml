clone:
  git:
    image: bash
    settings:
      lfs: false

labels:
  backend: local

steps:
  - name: build-landing
    image: bash
    commands:
      - export PATH="/home/diama/.nvm/versions/node/v24.16.0/bin:$PATH"
      - cd landing-page
      - npm install
      - npm run build

  - name: deploy-landing
    image: bash
    commands:
      - export PATH="/home/diama/.nvm/versions/node/v24.16.0/bin:$PATH"
      - chmod -R 777 /home/diama/repos/project-aeris/landing-page/dist 2>/dev/null || true
      - rsync -av --no-o --no-g landing-page/dist/ /home/diama/repos/project-aeris/landing-page/dist/ 2>/dev/null || cp -rf landing-page/dist/* /home/diama/repos/project-aeris/landing-page/dist/
      - chmod -R 777 /home/diama/repos/project-aeris/landing-page/dist 2>/dev/null || true
      - echo "Production static assets synced to live server path successfully!"

when:
  event: push
  branch: main