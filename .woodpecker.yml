pipeline:
  build-landing:
    image: node:22
    commands:
      - cd landing-page
      - npm install
      - npm run build

  deploy-landing:
    image: node:22
    commands:
      - mkdir -p /var/www/aeris.diama.dev
      - cp -r landing-page/dist/* /var/www/aeris.diama.dev/ 2>/dev/null || true
      - echo "Build and static deployment completed successfully!"

when:
  event: push
  branch: main